inputs:
  - type: xtream
    name: my_provider
    url: http://nomadiptv.online:25461
    username: "${env:IPTV_USERNAME}"
    password: "${env:IPTV_PASSWORD}"
    options:
      xtream_skip_vod: true
      xtream_skip_series: true

sources:
  - inputs:
      - my_provider
    targets:
      - name: clean_list
        filter: 'Group ~ ".*"'
        output:
          - type: xtream
          - type: m3u
