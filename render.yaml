services:
  - type: web
    name: iptv-tuliprox-test-84lb
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /healthcheck
    envVars:
      - key: PORT
        value: "8901"
      - key: TZ
        value: Europe/Madrid
      - key: TULIPROX_JWT_SECRET
        generateValue: true
      - key: OUTPUT_USERNAME
        generateValue: true
      - key: OUTPUT_PASSWORD
        generateValue: true
      - key: IPTV_USERNAME
        sync: false
      - key: IPTV_PASSWORD
        sync: false
